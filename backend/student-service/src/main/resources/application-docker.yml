logging:
  level:
    com.fmud.student: info

spring:
  datasource:
    url: ${STUDENT_DB_URL:jdbc:postgresql://postgres:5432/${POSTGRES_DB:fmud}}
    username: ${STUDENT_DB_USER:${POSTGRES_USER:fmud_user}}
    password: ${STUDENT_DB_PASSWORD:${POSTGRES_PASSWORD:change_me}}
  flyway:
    default-schema: students
    schemas: students
    table: student_flyway_schema_history
