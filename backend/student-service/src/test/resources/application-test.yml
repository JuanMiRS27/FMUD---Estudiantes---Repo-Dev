spring:
  datasource:
    url: jdbc:h2:mem:fmud_students;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/test-migration

fmud:
  storage:
    photo-path: ./target/test-storage/photos
    document-path: ./target/test-storage/documents
