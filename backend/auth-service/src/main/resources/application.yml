server:
  port: ${AUTH_SERVICE_PORT:8081}

spring:
  application:
    name: auth-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

fmud:
  security:
    jwt:
      issuer: ${JWT_ISSUER:fmud-auth-service}
      secret: ${JWT_SECRET:dev-only-change-this-secret-with-at-least-32-chars}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  dev-users:
    secretario-password: ${FMUD_DEV_SECRETARIO_PASSWORD:Cambiar123!}
    admin-password: ${FMUD_DEV_ADMIN_PASSWORD:Cambiar123!}
