spring:
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://postgres:5432/${POSTGRES_DB:fmud}}
    username: ${AUTH_DB_USER:${POSTGRES_USER:fmud_user}}
    password: ${AUTH_DB_PASSWORD:${POSTGRES_PASSWORD:change_me}}
  flyway:
    enabled: true

logging:
  level:
    org.flywaydb: info
    org.springframework.jdbc: warn
