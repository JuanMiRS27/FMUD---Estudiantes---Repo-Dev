server:
  port: ${API_GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

fmud:
  gateway:
    auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    student-service-url: ${STUDENT_SERVICE_URL:http://localhost:8082}
    timeout-seconds: ${GATEWAY_TIMEOUT_SECONDS:30}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  security:
    jwt:
      issuer: ${JWT_ISSUER:fmud-auth-service}
      secret: ${JWT_SECRET:dev-only-change-this-secret-with-at-least-32-chars}
